version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ksp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ksp_crime
      POSTGRES_USER: ksp_user
      POSTGRES_PASSWORD:<pick a new password>
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp_user -d ksp_crime"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ksp_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment below only if you have an NVIDIA GPU + nvidia-container-toolkit installed.
    # Without a GPU, Ollama runs fine on CPU for an 8B model — just a bit slower.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  neo4j:
    image: neo4j:5-community
    container_name: ksp_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH:  neo4j/<pick a new password>
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (used by the backend driver)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: ksp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ksp_user:ksp_pass@postgres:5432/ksp_crime
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ksp_graph_pass
      JWT_SECRET:  <pick a new random string>
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend/dist:/app/frontend_dist:ro

volumes:
  pgdata:
  ollama_data:
  neo4j_data:
